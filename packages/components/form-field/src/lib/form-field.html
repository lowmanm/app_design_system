<label class="brk-form-field__label" [attr.for]="control?.id">{{ label() }}</label>

<div class="brk-form-field__control">
  <ng-content></ng-content>
</div>

@if (hint() && !errorMessage()) {
  <p class="brk-form-field__hint" [id]="hintId">{{ hint() }}</p>
}

@if (errorMessage()) {
  <p class="brk-form-field__error" [id]="errorId" role="alert">{{ errorMessage() }}</p>
}
